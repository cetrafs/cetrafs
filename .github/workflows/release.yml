# SPDX-License-Identifier: GPL-2.0-or-later
#
# Build the Debian packages and publish a release.
#
# Tag push (0.8, 0.8.1, ...) or manual dispatch. Re-running for a tag
# REPLACES that tag's release, assets and all.
#
# Built in a DEBIAN container, not on the Ubuntu runner: the packages
# are for Debian and Proxmox, and the toolchains differ in ways that
# matter -- Ubuntu defaults _FORTIFY_SOURCE to 3, Debian to 2, which is
# why an unchecked pread built clean on one and failed on the other.
#
# The kernel module is not compiled here: cetrafs-dkms ships module
# SOURCE and DKMS builds it against the kernel that will run it.
#
# No tests run here. The validation that matters -- kernel suites, crash
# rig, fuzzers, soak, and the multi-node ctest suite -- needs a loadable
# out-of-tree module and real hardware, and happens before a tag is cut
# (docs/internal/RELEASE.md). CI builds packages; it does not pretend to
# vouch for them.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Which tag are we building
        id: tag
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-dkms dpkg-dev fakeroot git ca-certificates

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: The tag must match debian/changelog
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CL="$(dpkg-parsechangelog -S Version)"
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$CL" != "$TAG" ]; then
            echo "::error::tag $TAG does not match debian/changelog $CL -- the changelog is the single source of the version"
            exit 1
          fi
          echo "version=$CL" >> "$GITHUB_OUTPUT"

      # make deb already checks changelog vs dkms.conf vs debian/rules,
      # runs dpkg-checkbuilddeps, and collects everything into dist/.
      - name: Build the packages
        run: make deb

      - name: The dkms package must carry clean module source
        run: |
          V="${{ steps.version.outputs.version }}"
          dpkg-deb --fsys-tarfile "dist/cetrafs-dkms_${V}_all.deb" | tar -tf - > /tmp/dkms.list
          grep -q "usr/src/cetrafs-${V}/kmod/" /tmp/dkms.list \
            || { echo "::error::the dkms package has no module source"; exit 1; }
          # A .ko or .o in the shipped source means a dirty tree was packaged.
          ! grep -qE "usr/src/.*\.(ko|o)$" /tmp/dkms.list \
            || { echo "::error::the dkms package ships build artefacts, not clean source"; exit 1; }

      - name: Keep the changelog entry for the notes
        run: dpkg-parsechangelog -S Changes | tail -n +3 | sed 's/^\.$//; s/^  //' > dist/changes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest        # gh is preinstalled here; debian:13 has no gh
    steps:
      - name: Which tag are we releasing
        id: tag
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Assemble the release notes
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## cetrafs $V"
            echo
            cat dist/changes.txt
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "sudo apt install ./cetrafs-dkms_${V}_all.deb ./cetrafs-tools_${V}_amd64.deb"
            echo '```'
            echo
            echo "Built on Debian 13. The module ships as DKMS source and is compiled for"
            echo "your running kernel on install, and again on every kernel upgrade."
            echo
            echo "Alpha. The on-disk format carries no compatibility guarantee before 1.0:"
            echo "a format bump means reformat. Validation -- kernel suites, crash-consistency"
            echo "rig, fuzzers, soak and the multi-node cluster suite -- runs on real hardware"
            echo "before the tag; CI builds the packages and does not run those."
          } > notes.md
          cat notes.md

      - name: Replace any existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Delete rather than edit: editing keeps the previous build's
          # assets, and a stale .deb beside a fresh one is worse than no
          # release. --cleanup-tag=false keeps the git tag itself.
          gh release delete "$TAG" --yes --cleanup-tag=false --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "cetrafs $TAG" \
            --notes-file notes.md
